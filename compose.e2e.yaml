# E2Eテスト一式をDocker内で完結させる構成。ホストへのポート公開なし。
# (compose.yaml の名前は将来の開発環境用に空けてあるため、-f で明示的に指定する)
# 実行: docker compose -f compose.e2e.yaml run --build --rm e2e
# DBはvolumeを持たないので、毎回まっさらな状態から始まる(冪等)
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 2s
      timeout: 3s
      retries: 15

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
      # コンテナ間はhttpなのでSecure Cookieを無効化(本番では外さないこと)
      COOKIE_SECURE: "false"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 15

  e2e:
    build: ./e2e
    environment:
      E2E_BASE_URL: http://frontend:3000
    depends_on:
      frontend:
        condition: service_healthy
    volumes:
      # レポートと失敗時の成果物をホストから見られるようにする
      - ./e2e/test-results:/work/test-results
      - ./e2e/playwright-report:/work/playwright-report
